name: Release

# Pushing a tag vX.Y.Z builds every artifact from the tagged commit and
# publishes it under that one version. PostgreSQL 18 stable tags (v1.18.x)
# belong to postgresql/18; PostgreSQL 19 beta/stable tags (v0.19.x, v1.19.x)
# belong to main. The workflow checks that the tagged commit is reachable from
# its assigned branch.
#   - GitHub Release: the pgmem binaries (tar.gz, zip for Windows) with
#     SHA256SUMS, the wheels and the npm tarballs
#   - npm: the @pgmem/<platform> packages, then @pgmem/core, by trusted
#     publishing (OIDC, no token)
#   - PyPI: the pgmem platform wheels, by trusted publishing
#   - Maven Central: io.github.shibukawa.pgmem:pgmem, pgmem-junit5,
#     pgmem-spring, pgmem-micronaut and pgmem-native through the
#     Central Publisher Portal, with the CENTRAL_USERNAME / CENTRAL_PASSWORD
#     and GPG_PRIVATE_KEY / GPG_PASSPHRASE secrets of the release environment
#   - Go: fetches the tag through proxy.golang.org so that pkg.go.dev lists it
# README.md, "Releasing", lists the registry-side setup.
#
# Started by hand it rehearses a release (dry_run, the default: everything is
# built, npm publish runs with --dry-run, and the Portal validates the Maven
# bundle, which is then dropped), or publishes an existing tag to selected
# registries. A dispatch from main can use source_tag to run the current
# workflow against an older tag without moving that tag:
#   gh workflow run release.yml -f version=1.18.0
#   gh workflow run release.yml --ref main -f version=0.19.0 -f source_tag=v0.19.0 -f registries=npm -f dry_run=false

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v (X.Y.Z)
        required: true
      source_tag:
        description: Tag to build from (vX.Y.Z); defaults to v<version> when publishing
        required: false
      registries:
        description: Comma-separated subset of github,npm,pypi,maven,go
        default: github,npm,pypi,maven,go
      dry_run:
        description: Build and check everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      registries: ${{ steps.check.outputs.registries }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_TAG: ${{ inputs.source_tag }}
          INPUT_REGISTRIES: ${{ inputs.registries }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = push ]; then
            version=${REF#refs/tags/v}
            registries=github,npm,pypi,maven,go
            publish=true
            source_ref=$REF
          else
            version=$INPUT_VERSION
            registries=$INPUT_REGISTRIES
            publish=true
            if [ "$INPUT_DRY_RUN" = true ]; then publish=false; fi
            source_ref=$REF
            if [ -n "$INPUT_SOURCE_TAG" ]; then
              source_ref=refs/tags/$INPUT_SOURCE_TAG
            elif [ "$publish" = true ] && [ "$REF" != "refs/tags/v$version" ]; then
              source_ref=refs/tags/v$version
            fi
          fi
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::version '$version' is not X.Y.Z"
            exit 1
          fi
          if [ "$publish" = true ] && [ "$source_ref" != "refs/tags/v$version" ]; then
            echo "::error::publishing $version has to use source tag v$version, not $source_ref"
            exit 1
          fi
          if ! source_sha=$(git rev-parse "$source_ref^{commit}" 2>/dev/null); then
            echo "::error::source ref $source_ref does not exist"
            exit 1
          fi
          if [ "$publish" = true ]; then
            release_branch=origin/main
            case "$version" in
              1.18.*) release_branch=origin/postgresql/18 ;;
            esac
            if ! git merge-base --is-ancestor "$source_sha" "$release_branch"; then
              echo "::error::tag v$version must point to a commit reachable from $release_branch"
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "registries=,$(printf '%s' "$registries" | tr -d ' '),"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, registries $registries, publish $publish"

  binaries:
    name: Binary (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin-arm64, linux-amd64, linux-arm64, windows-amd64, windows-arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-go@v7
        with:
          # The oldest macOS a binary runs on follows the Go release (13 for
          # Go 1.27); move the macosx wheel tags in packages/python/hatch_build.py
          # along with this.
          go-version: "1.27.x"
          cache: false
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: scripts/build-binaries.sh "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  packages:
    name: Packages
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Stamp the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/set-version.sh "$VERSION"
      - name: GitHub Release archives
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/package-archives.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm tarballs
        run: scripts/build-npm.sh

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: Wheels
        run: |
          scripts/build-python-wheels.sh
          uvx twine check --strict dist/wheels/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/release
            dist/npm
            dist/wheels
          if-no-files-found: error

  github:
    name: GitHub Release
    needs: [prepare, packages]
    if: needs.prepare.outputs.publish == 'true' && contains(needs.prepare.outputs.registries, ',github,')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/release/*
            dist/wheels/*.whl
            dist/npm/*.tgz

  npm:
    name: npm
    needs: [prepare, packages]
    if: contains(needs.prepare.outputs.registries, ',npm,')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing; there is no NPM_TOKEN
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later, for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Publish the platform packages, then @pgmem/core
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          # npm quietly falls back to the placeholder token when the OIDC
          # exchange fails; verbose logs say why
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          publish() {
            metadata=$(tar -xzOf "$1" package/package.json)
            name=$(printf '%s' "$metadata" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).name)')
            version=$(printf '%s' "$metadata" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)')
            spec="$name@$version"
            existing=$(npm view "$spec" version 2>/dev/null || true)
            latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
            dist_tag=$(node -e '
              const [version, latest] = process.argv.slice(1);
              const parts = value => {
                const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
                if (!match) throw new Error(`invalid release version: ${value}`);
                return match.slice(1).map(Number);
              };
              const compare = (a, b) => {
                const left = parts(a), right = parts(b);
                for (let i = 0; i < left.length; i++) {
                  if (left[i] !== right[i]) return left[i] - right[i];
                }
                return 0;
              };
              const [, postgresMajor] = parts(version);
              if (version.startsWith("0.")) console.log("beta");
              else if (!latest || compare(version, latest) > 0) console.log("latest");
              else console.log(`postgresql-${postgresMajor}`);
            ' "$version" "$latest")
            echo "$spec will use npm dist-tag $dist_tag (current latest: ${latest:-none})"
            if [ "$existing" = "$version" ]; then
              tagged=$(npm view "$name@$dist_tag" version 2>/dev/null || true)
              if [ "$tagged" = "$version" ]; then
                echo "$spec already has dist-tag $dist_tag"
              elif [ "$PUBLISH" = true ]; then
                echo "::error::$spec already exists on npm, but dist-tag $dist_tag points to ${tagged:-no version}; correct the tag on npmjs.com before retrying"
                exit 1
              else
                echo "dry-run: $spec exists, but dist-tag $dist_tag points to ${tagged:-no version}; correct it on npmjs.com before publishing"
              fi
            elif [ "$PUBLISH" = true ]; then
              npm publish "$1" --access public --provenance --tag "$dist_tag"
            else
              npm publish "$1" --access public --dry-run --tag "$dist_tag"
            fi
          }
          for tgz in dist/npm/*.tgz; do
            case $tgz in */pgmem-core-*) ;; *) publish "$tgz" ;; esac
          done
          publish dist/npm/pgmem-core-*.tgz

  pypi:
    name: PyPI
    needs: [prepare, packages]
    if: needs.prepare.outputs.publish == 'true' && contains(needs.prepare.outputs.registries, ',pypi,')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels
          skip-existing: true

  maven:
    name: Maven Central
    needs: [prepare, binaries]
    if: contains(needs.prepare.outputs.registries, ',maven,')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Stamp the version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/set-version.sh "$VERSION"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Look for the version on Maven Central
        id: existing
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if curl -sfI "https://repo1.maven.org/maven2/io/github/shibukawa/pgmem/pgmem/$VERSION/pgmem-$VERSION.pom" > /dev/null; then
            echo "io.github.shibukawa.pgmem:pgmem:$VERSION is already on Maven Central, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and sign the bundle
        if: steps.existing.outputs.published != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/build-maven-bundle.sh
      - name: Upload to the Central Publisher Portal
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          if [ "$PUBLISH" = true ]; then
            scripts/publish-maven-central.sh "dist/maven/pgmem-$VERSION-bundle.zip"
          else
            scripts/publish-maven-central.sh --validate-only "dist/maven/pgmem-$VERSION-bundle.zip"
          fi

  go:
    name: Go module proxy
    needs: [prepare, packages]
    if: needs.prepare.outputs.publish == 'true' && contains(needs.prepare.outputs.registries, ',go,')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Fetch the tag through proxy.golang.org
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOPROXY: https://proxy.golang.org
        run: go list -m "github.com/shibukawa/pgmem@v$VERSION"
